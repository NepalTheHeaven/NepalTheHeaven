<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="142" viewBox="0 0 1200 142" role="img" aria-labelledby="title desc">
<title id="title">Always learning. Always creating. From the first idea to the final frame.</title><desc id="desc">Original illustration for Nabin Paudel's GitHub profile.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,Menlo,monospace}@media(prefers-reduced-motion:reduce){*{animation:none!important}.role2,.role3{opacity:0!important}.role1{opacity:1!important}}</style>
<defs><linearGradient id="line"><stop stop-color="#5ce8cf"/><stop offset="1" stop-color="#ac9cff"/></linearGradient></defs>
<style>@keyframes travel{to{stroke-dashoffset:-1200}}.flow{animation:travel 14s linear infinite}</style>
<rect x="1" y="1" width="1198" height="140" rx="18" fill="#101b2b" stroke="#2a3d53"/>
<path d="M44 104H1156" stroke="#26394e"/>
<path class="flow" d="M44 104H1156" stroke="url(#line)" stroke-width="2" stroke-dasharray="160 1040" fill="none"/>
<text x="45" y="53" fill="#dceaf8" font-size="23" font-weight="700">Always learning. Always creating.</text>
<text x="45" y="82" fill="#8da7bf" font-size="16">From the first idea to the final frame.</text>
<text x="1153" y="63" text-anchor="end" fill="#7ce5d4" font-size="15" class="mono" letter-spacing="2">DESIGN → BUILD → REFINE</text>
</svg>