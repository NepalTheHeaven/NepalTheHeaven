<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title">
<title id="title">Code and cinema: an animated app-building terminal beside a video-editing timeline and moving sound waveform.</title>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,Menlo,monospace}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>

<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e1b2c"/><stop offset="1" stop-color="#191c31"/></linearGradient>
<clipPath id="typing"><rect class="type" x="64" y="211" width="452" height="33"/></clipPath></defs>
<style>
@keyframes type{0%,10%{width:0}55%,90%{width:452px}100%{width:0}}
@keyframes play{0%{transform:translateX(0)}100%{transform:translateX(410px)}}
@keyframes cursor{50%{opacity:0}}
@keyframes waveform{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.type{animation:type 9s steps(32,end) infinite}.playhead{animation:play 9s linear infinite}.cursor{animation:cursor 1.2s step-end infinite}.wave{transform-box:fill-box;transform-origin:center;animation:waveform 1.6s ease-in-out infinite}.w2{animation-delay:-.4s}.w3{animation-delay:-.9s}.w4{animation-delay:-1.2s}
</style>
<rect x="1" y="1" width="1198" height="348" rx="20" fill="url(#bg)" stroke="#2b4056"/>
<text x="42" y="45" font-size="14" font-weight="700" letter-spacing="2" fill="#72dfd2">TWO WAYS TO CREATE</text>
<text x="42" y="86" font-size="29" fill="#e6effa" font-weight="700">One eye for detail. Two creative worlds.</text>
<g transform="translate(42 113)"><rect width="536" height="164" rx="12" fill="#081421" stroke="#304959"/><path d="M0 35H536" stroke="#253a4b"/><circle cx="19" cy="18" r="4" fill="#ee939f"/><circle cx="34" cy="18" r="4" fill="#e4c287"/><circle cx="49" cy="18" r="4" fill="#6de5cc"/><text x="516" y="23" font-size="11" text-anchor="end" fill="#8ca6bd" class="mono">THE BUILD</text><text x="22" y="70" fill="#6edbc9" font-size="18" class="mono">$ flutter run</text><text x="22" y="96" fill="#8da7bd" font-size="15" class="mono">From a sketch to a working screen.</text><path class="cursor" d="M497 112V132" stroke="#62e6ce" stroke-width="3"/></g>
<text x="64" y="241" fill="#c0eade" font-size="18" class="mono" clip-path="url(#typing)">Every interaction has a purpose.</text>
<g transform="translate(600 113)"><rect width="558" height="164" rx="12" fill="#151829" stroke="#3c405d"/><text x="18" y="23" font-size="11" fill="#aaa4d1" class="mono">THE EDIT</text><text x="537" y="23" font-size="11" text-anchor="end" fill="#a4a1be" class="mono">PICTURE / COLOUR / SOUND</text>
<path d="M76 39H532M76 69H532M76 100H532M76 137H532" stroke="#30334c"/>
<text x="17" y="60" font-size="11" fill="#949ebc" class="mono">VIDEO</text><text x="17" y="91" font-size="11" fill="#949ebc" class="mono">GRADE</text><text x="17" y="125" font-size="11" fill="#949ebc" class="mono">SOUND</text>
<rect x="78" y="46" width="94" height="18" rx="4" fill="#596eaa"/><rect x="177" y="46" width="150" height="18" rx="4" fill="#8271b6"/><rect x="332" y="46" width="91" height="18" rx="4" fill="#507f92"/><rect x="428" y="46" width="100" height="18" rx="4" fill="#7974a6"/>
<rect x="78" y="77" width="156" height="18" rx="4" fill="#324c63"/><rect x="239" y="77" width="289" height="18" rx="4" fill="#3e535a"/>
<g stroke="#78dcca" stroke-width="3" stroke-linecap="round">
<path class="wave" d="M87 115V127M103 112V130M119 107V135M135 111V131M151 114V128"/>
<path class="wave w2" d="M167 109V133M183 114V128M199 105V137M215 111V131M231 113V129"/>
<path class="wave w3" d="M247 111V131M263 106V136M279 113V129M295 108V134M311 115V127"/>
<path class="wave w4" d="M327 107V135M343 111V131M359 115V127M375 109V133M391 106V136"/>
<path class="wave w2" d="M407 109V133M423 114V128M439 105V137M455 111V131M471 113V129M487 108V134M503 111V131M519 115V127"/>
</g><g class="playhead"><path d="M90 35V145" stroke="#f4d69c" stroke-width="2"/><path d="M85 31H95L90 37Z" fill="#f4d69c"/></g></g>
<text x="44" y="317" fill="#8da9c0" font-size="16">Thoughtful mobile experiences.</text><text x="601" y="317" fill="#aea5cd" font-size="16">Stories shaped through rhythm, colour, and sound.</text>
</svg>